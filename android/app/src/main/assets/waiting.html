<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Galaxy Trackpad</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0e1116; color: #9aa7b8;
    font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .box { padding: 24px; max-width: 420px; }
  h1 {
    margin: 0 0 12px;
    font-size: 14px; letter-spacing: 0.14em;
    color: #9aa7b8; font-weight: 700;
  }
  .title {
    font-size: 22px; font-weight: 700; color: #e8edf5;
    margin-bottom: 8px;
  }
  .sub { font-size: 14px; line-height: 1.5; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #9aa7b8; display: inline-block;
    margin-right: 8px; vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>GALAXY TRACKPAD</h1>
    <div class="title"><span class="dot"></span>WAITING</div>
    <p class="sub">
      Start the Windows app and connect USB.<br>
      Allow USB debugging if asked.<br>
      This screen retries automatically.
    </p>
  </div>
</body>
</html>
