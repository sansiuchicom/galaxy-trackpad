<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GT BT Pad</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  background: #0e1116; color: #e8edf5;
  font-family: "Segoe UI", sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#bar {
  height: 44px; display: flex; align-items: center; gap: 12px;
  padding: 0 14px; background: #12161d; border-bottom: 1px solid #222833;
  touch-action: manipulation;
}
#status { font-size: 14px; font-weight: 700; color: #5dde9f; }
#hint { font-size: 12px; color: #8b97a8; }
#pad {
  position: absolute; left: 0; right: 0; top: 44px; bottom: 0;
  background: #171b22;
  background-image:
    linear-gradient(#222833 1px, transparent 1px),
    linear-gradient(90deg, #222833 1px, transparent 1px);
  background-size: 48px 48px;
}
</style>
</head>
<body>
<div id="bar">
  <span id="status">Waiting for PC…</span>
  <span id="hint">Bluetooth — PC Galaxy Trackpad must be running (Automatic)</span>
</div>
<div id="pad"></div>
<script>
const pad = document.getElementById("pad");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");
const pointers = new Map();
let linked = false;

function setStatus(t) { statusEl.textContent = t; }
function setHint(t) { hintEl.textContent = t; }

window.__gtBtLog = function (msg) {
  if (!msg) return;
  setHint(String(msg));
};

// Called from Android when RFCOMM framed mode is on.
window.__gtBtLinked = function (ok) {
  linked = !!ok;
  if (linked) {
    setStatus("CONNECTED");
    setHint("Bluetooth pad — move fingers");
  } else {
    setStatus("Waiting for PC…");
    setHint("Bluetooth — PC Galaxy Trackpad must be running (Automatic)");
  }
};

function post(obj) {
  if (!linked) return;
  try {
    if (window.GalaxyBT && GalaxyBT.sendPacket) {
      GalaxyBT.sendPacket(JSON.stringify(obj));
    }
  } catch (e) {}
}

function round(v, digits) {
  const k = Math.pow(10, digits);
  return Math.round(v * k) / k;
}

function getContact(event) {
  const r = pad.getBoundingClientRect();
  const x = (event.clientX - r.left) / Math.max(1, r.width);
  const y = (event.clientY - r.top) / Math.max(1, r.height);
  const tool = event.pointerType === "pen" ? "pen" : "touch";
  const c = {
    id: event.pointerId,
    tool,
    x: round(Math.max(0, Math.min(1, x)), 5),
    y: round(Math.max(0, Math.min(1, y)), 5)
  };
  if (tool === "pen") {
    c.pressure = round(event.pressure, 3);
    c.tiltX = event.tiltX;
    c.tiltY = event.tiltY;
  }
  return c;
}

let movePending = false;

function send(eventName) {
  post({
    event: eventName,
    timestamp: Math.round(performance.now()),
    contacts: Array.from(pointers.values())
  });
}

// Bluetooth cannot keep up with one packet per finger per touch sample;
// send at most one move per display frame with every finger in it.
function queueMove() {
  if (movePending) return;
  movePending = true;
  requestAnimationFrame(() => {
    movePending = false;
    if (pointers.size) send("move");
  });
}

pad.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  pad.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, getContact(event));
  send("down");
});
pad.addEventListener("pointermove", (event) => {
  if (!pointers.has(event.pointerId)) return;
  event.preventDefault();
  pointers.set(event.pointerId, getContact(event));
  queueMove();
});
function release(event) {
  if (!pointers.has(event.pointerId)) return;
  event.preventDefault();
  pointers.delete(event.pointerId);
  send("up");
}
pad.addEventListener("pointerup", release);
pad.addEventListener("pointercancel", release);
pad.addEventListener("contextmenu", (e) => e.preventDefault());

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    pointers.clear();
    send("up");
  }
});
</script>
</body>
</html>
